services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: premiatto
      POSTGRES_PASSWORD: premiatto
      POSTGRES_DB: premiatto
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U premiatto -d premiatto"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://premiatto:premiatto@postgres:5432/premiatto?schema=public
      PORT: 3000
      CORS_ORIGIN: "http://localhost:8080,http://localhost:5173"
      JWT_SECRET: "local-development-jwt-secret-change-before-production-32chars"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      UPLOADS_DIR: "/data/uploads"
      SUPER_ADMIN_EMAIL: "admin@premiatto.com.br"
      SUPER_ADMIN_PASSWORD: "TroquePorUmaSenhaForte123!"
      SUPER_ADMIN_NAME: "Administrador"
    volumes:
      - uploads:/data/uploads
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
